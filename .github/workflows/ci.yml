name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.24.4
  AGENTICA_SHA256: 2397e67f89f4ad5f939d0d1f9ff5b5f8dd89f31629d1af8c4a6732e03467cac6

jobs:
  # `agentica check` needs the llama.cpp libraries: the manifest names them as native files.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: deps/llama.cpp
          key: llama-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Fetch llama.cpp
        run: scripts/fetch-llama.sh

      # The locked packages (Bond), checked against the hashes of agentica.lock.
      - name: Install the packages
        run: |
          agentica --version
          make install

      - name: Check
        run: make check

      - name: Format
        run: make fmt-check

  # The server loads a 0.5B model on the CPU of the runner and answers a few short prompts.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: deps/llama.cpp
          key: llama-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: deps/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}

      # Both scripts check the sha256 and skip a download they already have.
      - name: Fetch llama.cpp and the model
        run: |
          scripts/fetch-llama.sh
          scripts/fetch-model.sh

      - name: Install the packages
        run: |
          agentica --version
          make install

      # tests/ uses unittest from the standard library; nothing to pip install.
      - name: Test
        run: make test

      - name: Server log
        if: failure()
        run: cat tests/server.log
