name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.34.1
  AGENTICA_SHA256: f1c7caa3947ac5947a87566febb1c4b06f05793bd4f03752b21fd416b44b73db

jobs:
  # `agentica check` needs the llama.cpp libraries: the manifest names them as native files.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: native/linux
          key: llama-${{ hashFiles('scripts/fetch.agc', 'scripts/llama-release') }}

      - name: Fetch llama.cpp
        run: agentica scripts/fetch.agc llama

      # The locked packages (Bond), checked against the hashes of agentica.lock.
      - name: Install the packages
        run: |
          agentica --version
          make install

      - name: Check
        run: make check

      - name: Format
        run: make fmt-check

      - name: Fetch the llama.cpp headers
        run: agentica scripts/fetch.agc headers

      - name: Check the bindings
        run: make check-bindings

  # The server loads a 0.5B model on the CPU of the runner and answers a few short prompts.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: native/linux
          key: llama-${{ hashFiles('scripts/fetch.agc', 'scripts/llama-release') }}

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: deps/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: model-${{ hashFiles('scripts/model') }}

      # The script checks the sha256 and skips a download it already has.
      - name: Fetch llama.cpp and the model
        run: |
          agentica scripts/fetch.agc llama
          agentica scripts/fetch.agc headers
          agentica scripts/fetch.agc model

      - name: Install the packages
        run: |
          agentica --version
          make install

      # The tests are Agentica programs run by `agentica test`.
      - name: Test
        run: make test

      - name: Server log
        if: failure()
        run: cat tests/server.log
