name = "agentica-llama-server"
agentica = "0.38.0"

[style]
blank_line_after_end = true

# Prebuilt llama.cpp release (`agentica scripts/fetch.agc llama`). libllama.so finds
# libggml.so next to itself through RUNPATH=$ORIGIN.
[native.llama]
linux = { file = "native/linux/libllama.so.1" }

[native.ggml]
linux = { file = "native/linux/libggml.so.1" }

[dependencies]
bond = { git = "https://github.com/agentica-lang/bond", tag = "0.15.1" }

# The transformers of ml, for `server_ml.agc`. Its ggml native module builds on first use and is optional: without it
# only the reference backend runs (see docs/ml.md).
transformers = { git = "https://github.com/agentica-lang/ml", tag = "transformers-0.6.0", subdir = "transformers" }
tensor = { git = "https://github.com/agentica-lang/ml", tag = "tensor-0.6.0", subdir = "tensor" }
hub = { git = "https://github.com/agentica-lang/ml", tag = "hub-0.6.0", subdir = "hub" }
