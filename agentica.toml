name = "agentica-llama-server"

# Needs Agentica 0.27.0 or later (Bond 0.10.0 needs it).

[style]
blank_line_after_end = true

# Prebuilt llama.cpp release (scripts/fetch-llama.sh). libllama.so finds
# libggml.so next to itself through RUNPATH=$ORIGIN.
[native.llama]
linux = { file = "native/linux/libllama.so.0" }

[native.ggml]
linux = { file = "native/linux/libggml.so.0" }

[dependencies]
bond = { git = "https://github.com/agentica-lang/bond", tag = "0.10.0" }
